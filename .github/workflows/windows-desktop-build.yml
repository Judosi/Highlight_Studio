name: Build ready Windows portable ZIP

on:
  workflow_dispatch:
    inputs:
      require_signature:
        description: Require valid Authenticode signatures (production certificate secrets must be configured)
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json

      - name: Prepare optional Windows signing certificate
        shell: powershell
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGN_PFX_BASE64) {
            $Path = Join-Path $env:RUNNER_TEMP "highlight-studio-signing.pfx"
            [IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
            "HIGHLIGHT_STUDIO_SIGN_PFX_PATH=$Path" | Out-File -FilePath $env:GITHUB_ENV -Append
            "HIGHLIGHT_STUDIO_SIGN_PFX_PASSWORD=$env:WINDOWS_SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ("${{ inputs.require_signature }}" -eq "true") {
            throw "require_signature was selected, but WINDOWS_SIGN_PFX_BASE64 is not configured."
          } else {
            Write-Host "No signing certificate configured. The artifact will be explicitly marked unsigned-test."
          }

      - name: Build production frontend, standalone backend, installer, and portable EXE
        shell: powershell
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          HIGHLIGHT_STUDIO_UPDATE_URL: ${{ secrets.HIGHLIGHT_STUDIO_UPDATE_URL }}
          HIGHLIGHT_STUDIO_BETA_UPDATE_URL: ${{ secrets.HIGHLIGHT_STUDIO_BETA_UPDATE_URL }}
          HIGHLIGHT_STUDIO_LICENSE_PUBLIC_KEY_B64: ${{ secrets.HIGHLIGHT_STUDIO_LICENSE_PUBLIC_KEY_B64 }}
          HIGHLIGHT_STUDIO_LICENSE_SERVER_URL: ${{ secrets.HIGHLIGHT_STUDIO_LICENSE_SERVER_URL }}
          HIGHLIGHT_STUDIO_CHECKOUT_URL: ${{ secrets.HIGHLIGHT_STUDIO_CHECKOUT_URL }}
          HIGHLIGHT_STUDIO_ACCOUNT_URL: ${{ secrets.HIGHLIGHT_STUDIO_ACCOUNT_URL }}
          HIGHLIGHT_STUDIO_SUPPORT_URL: ${{ secrets.HIGHLIGHT_STUDIO_SUPPORT_URL }}
          HIGHLIGHT_STUDIO_PRIVACY_URL: ${{ secrets.HIGHLIGHT_STUDIO_PRIVACY_URL }}
          HIGHLIGHT_STUDIO_TERMS_URL: ${{ secrets.HIGHLIGHT_STUDIO_TERMS_URL }}
          HIGHLIGHT_STUDIO_TELEMETRY_URL: ${{ secrets.HIGHLIGHT_STUDIO_TELEMETRY_URL }}
          HIGHLIGHT_STUDIO_FEEDBACK_URL: ${{ secrets.HIGHLIGHT_STUDIO_FEEDBACK_URL }}
          HIGHLIGHT_STUDIO_CRASH_REPORT_URL: ${{ secrets.HIGHLIGHT_STUDIO_CRASH_REPORT_URL }}
        run: |
          $RequireSigned = "${{ inputs.require_signature }}" -eq "true"
          try {
            ./scripts/windows/build_hybrid_release.ps1 -RequireSigned:$RequireSigned
          } catch {
            $Message = [string]$_.Exception.Message
            $Message = $Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows release build failed::$Message"
            throw
          }

      - name: Verify packaged production resources and media tools
        shell: powershell
        run: |
          $Version = (Get-Content desktop/electron/package.json -Raw | ConvertFrom-Json).version
          try {
            ./scripts/windows/verify_packaged_layout.ps1 -ArtifactsDir build/desktop/installer -Version $Version
          } catch {
            $Message = [string]$_.Exception.Message
            $Message = $Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Packaged layout verification failed::$Message"
            throw
          }

      - name: Create ready-to-run portable ZIP
        shell: powershell
        run: |
          $Version = (Get-Content desktop/electron/package.json -Raw | ConvertFrom-Json).version
          $RequireSigned = "${{ inputs.require_signature }}" -eq "true"
          try {
            ./scripts/windows/package_portable_release.ps1 -ArtifactsDir build/desktop/installer -OutputDir build/desktop/portable -Version $Version -RequireSigned:$RequireSigned
          } catch {
            $Message = [string]$_.Exception.Message
            $Message = $Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Portable ZIP creation failed::$Message"
            throw
          }

      - name: Validate release archive integrity and secret exclusions
        shell: powershell
        run: |
          $Archive = Get-ChildItem build/desktop/portable/*.zip | Select-Object -First 1
          if (!$Archive) { throw "Ready portable ZIP was not created." }
          python tools/desktop/verify_portable_zip.py $Archive.FullName

      - name: Smoke test extracted portable ZIP and persisted project
        shell: powershell
        run: |
          $Version = (Get-Content desktop/electron/package.json -Raw | ConvertFrom-Json).version
          $Archive = Get-ChildItem build/desktop/portable/*.zip | Select-Object -First 1
          ./scripts/windows/test_portable_release.ps1 -ArchivePath $Archive.FullName -ArtifactsDir build/desktop/installer -Version $Version

      - name: Upload ready Windows ZIP and verification report
        uses: actions/upload-artifact@v4
        with:
          name: highlight-studio-windows-x64-${{ github.run_number }}
          path: |
            build/desktop/portable/*.zip
            build/desktop/portable-smoke/*
          if-no-files-found: error
          retention-days: 30
