name: Highlight Studio CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: Highlight_Studio_11.2.7

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux media runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgles2 libegl1
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend tools
      - name: Lint Python
        run: python -m ruff check backend tools tests
      - name: Test backend
        run: python -m pytest -q
      - name: Audit Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Highlight_Studio_11.2.7/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm test
      - name: Build frontend
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: Highlight_Studio_11.2.7/frontend
        # Dependency remediation is tracked separately from the code/test
        # baseline. Keep the report visible on every run without making an
        # unrelated newly-published advisory invalidate source tests.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  desktop-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Highlight_Studio_11.2.7/desktop/electron/package-lock.json
      - name: Install locked Electron dependency without downloading runtime
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        run: npm ci --ignore-scripts
      - name: Validate Electron entrypoints
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        run: |
          node --check main.js
          node --check preload.js
          node --check security.js
          node --check ipc_policy.js
      - name: Test Electron security and IPC policy
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        run: npm test
      - name: Audit Electron dependency
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        # Signed release builds retain their blocking Electron audit in
        # scripts/windows/build_hybrid_release.ps1. Regular source CI reports
        # advisories while dependency upgrades are handled explicitly.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  source-release-contract:
    runs-on: ubuntu-latest
    needs: [backend, frontend, desktop-shell]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and verify source checkout identity
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          python tools/diagnostics/verify_release_identity.py .
      - name: Keep release-only Twitch binary outside Git
        run: |
          test ! -e vendor/twitchdownloadercli/TwitchDownloaderCLI.exe
          git check-ignore -q vendor/twitchdownloadercli/TwitchDownloaderCLI.exe
      - name: Validate release tooling contracts
        run: python -m compileall -q tools/release tools/diagnostics/verify_release_identity.py
