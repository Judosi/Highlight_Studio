name: Highlight Studio CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: Highlight_Studio_11.2.7

jobs:
  backend:
    needs: frontend
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Restore production frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Highlight_Studio_11.2.7/frontend/dist
      - name: Install Linux media runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgles2 libegl1
      - name: Install Windows media runtime
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress --yes
          ffmpeg -version
          ffprobe -version
      - name: Preserve the Windows subprocess environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SystemRoot=$env:SystemRoot" >> $env:GITHUB_ENV
          "ComSpec=$env:ComSpec" >> $env:GITHUB_ENV
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q backend tools
      - name: Lint Python
        run: python -m ruff check backend tools tests
      - name: Test backend
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Annotate backend test failures
        if: failure()
        run: python tools/quality/report_pytest_failures.py pytest-results.xml
      - name: Audit Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: Highlight_Studio_11.2.7/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm run build
      - name: Test frontend against the production build
        working-directory: Highlight_Studio_11.2.7/frontend
        run: npm test
      - name: Publish production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Highlight_Studio_11.2.7/frontend/dist
          if-no-files-found: error
          retention-days: 1
      - name: Audit frontend dependencies
        working-directory: Highlight_Studio_11.2.7/frontend
        # Dependency remediation is tracked separately from the code/test
        # baseline. Keep the report visible on every run without making an
        # unrelated newly-published advisory invalidate source tests.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  desktop-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install locked Electron dependency without downloading runtime
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        env:
          npm_config_cache: ${{ runner.temp }}/highlight-studio-electron-npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Electron entrypoints
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        run: |
          node --check main.js
          node --check preload.js
          node --check security.js
          node --check ipc_policy.js
      - name: Test Electron security and IPC policy
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        run: npm test
      - name: Audit Electron dependency
        working-directory: Highlight_Studio_11.2.7/desktop/electron
        # Signed release builds retain their blocking Electron audit in
        # scripts/windows/build_hybrid_release.ps1. Regular source CI reports
        # advisories while dependency upgrades are handled explicitly.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  source-release-contract:
    runs-on: ubuntu-latest
    needs: [backend, frontend, desktop-shell]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Highlight_Studio_11.2.7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore verified production frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Highlight_Studio_11.2.7/frontend/dist
      - name: Verify source checkout identity against the production build
        run: python tools/diagnostics/verify_release_identity.py .
      - name: Keep release-only Twitch binary outside Git
        run: |
          test ! -e vendor/twitchdownloadercli/TwitchDownloaderCLI.exe
          git check-ignore -q vendor/twitchdownloadercli/TwitchDownloaderCLI.exe
      - name: Validate release tooling contracts
        run: python -m compileall -q tools/release tools/diagnostics/verify_release_identity.py
