services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-highlight_studio_web}
      POSTGRES_USER: ${POSTGRES_USER:-highlight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - local_web_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-highlight} -d ${POSTGRES_DB:-highlight_studio_web}"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  local_web_postgres_data:
